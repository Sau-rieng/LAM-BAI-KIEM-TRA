<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Giáo viên – Kiểm tra Hóa học</title>
<link rel="manifest" href="manifest-gv.json">
<link rel="apple-touch-icon" href="hinh/app/icon-180.png">
<link rel="icon" type="image/png" href="hinh/app/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kiểm tra Hóa">
<meta name="theme-color" content="#172033">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--chi:#b8235a;--ink:#172033;--muted:#5b6175;--line:#d9dce5;--bg:#f4f5f9;--card:#fff;--pri:#1f5fbf;--ok:#1e8e3e;--okbg:#e8f5ec;--warn:#a06b00;--warnbg:#fff4d6;--bad:#c5221f;--off:#eceef3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px}
main{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.hidden{display:none!important}
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 8px rgba(0,0,0,.06);padding:16px;margin-bottom:12px}
h1{font-size:23px;margin:4px 0}
h2{font-size:19px;margin:0}
.sub{color:var(--muted);font-size:15px;margin:2px 0 0}
label{display:block;font-weight:600;margin:14px 0 6px}
input{width:100%;font-size:20px;padding:12px 14px;border:2px solid var(--line);border-radius:12px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;color:var(--ink);background:#fff}
.btn{background:var(--pri);color:#fff;width:100%;margin-top:16px}
.btn2{border:2px solid var(--line)}
.msg{margin-top:10px;min-height:20px;font-weight:600;color:var(--bad)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.top button{padding:9px 12px;font-size:15px}
.loc{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap}
.loc button{border:2px solid var(--line);padding:8px 12px;font-size:15px}
.loc button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dot .dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dot .ma{font-size:14px;color:var(--muted)}
.sw{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sw button{flex:1;min-width:150px;border:2px solid var(--line);text-align:left;padding:10px 12px;font-size:15px}
.sw button b{display:block;font-size:17px}
.sw button.bat{border-color:var(--ok);background:var(--okbg)}
.sw button.bat b{color:var(--ok)}
.sw button:disabled{opacity:.5}
.canh{margin-top:10px;font-size:14px;color:var(--warn);background:var(--warnbg);border-radius:8px;padding:8px 10px}
.dot .theo{margin-top:10px;width:100%;background:var(--ink);color:#fff}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--off);color:var(--muted);white-space:nowrap}
.ttDong{font-size:13px;color:var(--muted);white-space:nowrap;font-style:italic}
.chip.mo{background:var(--okbg);color:var(--ok)}
.chip.cho{background:var(--warnbg);color:var(--warn)}
.sw button.chinh{border-color:var(--pri);background:#eaf1fc}
.sw button.chinh b{color:var(--pri)}
.sw button.batdau{border-width:3px}
.dem{margin-top:10px;font-size:18px;text-align:center;background:var(--bg);border-radius:10px;padding:8px}
.dem b{font-size:24px;font-variant-numeric:tabular-nums}
.tt.dangcho{color:var(--pri)}
.tk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.tk div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.tk b{display:block;font-size:24px}
.tk span{font-size:13px;color:var(--muted)}
.hs{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line)}
.hs .so{flex:none;width:30px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.hs .ten{flex:1;min-width:0}
.hs .tt{flex:none;text-align:right;font-size:14px;font-weight:700}
.tt.danop{color:var(--ok)}
.tt.danglam{color:var(--warn)}
.tt.chua{color:var(--muted);font-weight:500}
.tt a{color:inherit}
.lan{font-size:12px;font-weight:700;color:var(--warn);margin-left:6px}
.xem{font-size:12px;font-weight:600;color:var(--ok)}
.xem.chua{color:var(--muted)}
.capnhat{font-size:13px;color:var(--muted);text-align:center;margin:6px 0}
.loi{color:var(--bad);font-weight:600;margin-top:8px}
/* Khoi 5 - ho so */
.nutTop{display:flex;gap:8px}
.bang{overflow-x:auto;margin:10px -16px 0;padding:0 16px;-webkit-overflow-scrolling:touch}
.bang table{border-collapse:separate;border-spacing:0;font-size:15px;min-width:100%}
.bang th,.bang td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.bang th{font-size:13px;color:var(--muted);position:sticky;top:0;background:var(--card)}
.bang .tn{position:sticky;left:0;background:var(--card);text-align:left;max-width:170px;overflow:hidden;text-overflow:ellipsis;z-index:1}
.bang .tn button{padding:0;background:none;font-weight:600;color:var(--pri);text-align:left;font-size:15px;border-radius:0}
.bang td a{color:var(--ink);text-decoration:none;font-weight:700}
.bang td.thap a{color:var(--bad);text-decoration:underline}
.bang td.tb{font-weight:800;background:var(--bg)}
.bang tr.tblop td{font-weight:700;color:var(--muted);border-bottom:0}
.bang .lan2{font-size:10px;color:var(--warn);vertical-align:super}
.chuthich{font-size:14px;color:var(--muted);margin-top:10px;line-height:1.5}
.chuthich b{color:var(--ink)}
.tk3{grid-template-columns:repeat(3,1fr)}
.bai{display:flex;gap:10px;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}
.bai .tb2{flex:1;min-width:0}
.bai .tb2 div{font-size:14px;color:var(--muted)}
.bai .d{flex:none;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.bai .d.thap{color:var(--bad)}
.bai a.pdf{flex:none;font-size:14px;font-weight:700;color:var(--pri);border:2px solid var(--line);border-radius:10px;padding:6px 10px;text-decoration:none}
.bieudo svg{width:100%;height:auto;display:block}
.ghiOK{color:var(--ok);font-weight:600;margin-top:8px}
.tt a.d-do{color:#c5221f!important}
.tt a.d-vang{color:#b07800!important}
.bang td.d-do a{color:#c5221f;text-decoration:underline}
.bang td.d-vang a{color:#b07800}
.bai .d.d-do{color:#c5221f}
.bai .d.d-vang{color:#b07800}
.ptBtn{width:100%;margin-top:10px;border:2px solid var(--pri);color:var(--pri);background:#eef4fd}
.pt{margin-top:10px}
.pt .ph{display:flex;justify-content:space-between;align-items:center;margin:4px 0 6px}
.ptc{border-top:1px solid var(--line);padding:10px 2px}
.ptc .h{display:flex;gap:10px;align-items:baseline;cursor:pointer}
.ptc .so{flex:none;font-weight:800;color:var(--muted);width:26px}
.ptc .nd{flex:1;min-width:0}
.ptc .nd b{font-size:15px}
.ptc .nd .tx{font-size:14px;color:var(--ink);display:block;margin-top:2px}
.ptc .ps{flex:none;font-weight:800;font-size:18px}
.ptc .ps.cao{color:#c5221f}.ptc .ps.vua{color:#b07800}.ptc .ps.thap{color:var(--ok)}
.ptc .ct{margin:8px 0 0 36px;font-size:14px;line-height:1.45}
.ptc .ct img{max-width:100%;height:auto;max-height:220px;display:block;margin:6px 0}
.ptc .ct .op{display:flex;gap:8px;padding:3px 0}
.ptc .ct .op.dung{color:var(--ok);font-weight:700}
.ptc .ct .bar{flex:none;width:90px;height:10px;background:var(--off);border-radius:5px;margin-top:5px;overflow:hidden}
.ptc .ct .bar i{display:block;height:100%;background:#9aa3b5}
.ptc .ct .op.dung .bar i{background:var(--ok)}
.nhCard h2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nhTv{font-size:14px;color:var(--muted);margin:2px 0 6px}
.nhTv b{color:var(--ink);font-weight:600}
.nhSua{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px;margin:8px 0;font-size:15px}
@media (max-width:480px){.nhSua{grid-template-columns:1fr}}
.nhSua label{display:flex;gap:8px;align-items:center;margin:0;font-weight:400}
.nhSua input{width:20px;height:20px}
.nhSua small{color:var(--muted)}
.nhTong td,.nhTong th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.pd{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0 8px}
.pd div{border:2px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center}
.pd b{display:block;font-size:19px}
.pd span{font-size:12px;color:var(--muted);display:block}
.pd i{font-style:normal;font-size:12px;color:var(--muted)}
.pd .do b{color:#c5221f}
@media (max-width:480px){.pd{grid-template-columns:repeat(3,1fr)}}
.khoi button{font-size:17px;padding:10px 18px}
.khoi button small{font-weight:500;color:inherit;opacity:.7;margin-left:4px}
.nhom{font-size:15px;font-weight:800;color:var(--muted);margin:16px 4px 6px;text-transform:uppercase;letter-spacing:.3px}
.dsGon{background:var(--card);border-radius:14px;box-shadow:0 1px 8px rgba(0,0,0,.06);overflow:hidden}
.dong{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-radius:0;font-weight:400}
.dsGon .dong:first-child{border-top:0}
.dong .tt2{flex:1;min-width:0}
.dong .tt2 b{display:block;font-size:16px}
.dong .tt2 .ma{font-size:13px;color:var(--muted)}
.dong .mui{flex:none;color:var(--muted);font-size:14px}
.dt{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}
.dt.ok{color:var(--ok)}
.dsGon .card.dot{box-shadow:none;border-radius:0;margin:0;border-top:1px solid var(--line);background:#fafbfe}
.dongX{float:right;margin:-6px -6px 0 8px;width:36px;height:36px;padding:0;border:2px solid var(--line);border-radius:50%;font-size:16px;color:var(--muted)}
.thuGon{margin-top:10px;font-size:14px;color:var(--muted);background:none;padding:4px 0}
.moNoi{border:2px solid var(--warn)}
.bang td.vg{color:var(--warn);font-weight:800}
.vgRow{padding:10px 2px;border-top:1px solid var(--line)}
.vgRow .vt{font-weight:700}
.vgRow .vs{font-size:14px;color:var(--warn);font-weight:600;margin-top:2px}
.vgBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.vgBtns button{border:2px solid var(--line);padding:7px 12px;font-size:14px}
.vgBtns input{flex:1;min-width:150px;font-size:15px;padding:8px 10px;border-radius:10px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--warn);background:var(--warnbg);border-radius:20px;padding:2px 8px;margin-left:6px}
.btnVang{margin-left:8px;border:2px solid var(--line);padding:3px 8px;font-size:12px;border-radius:8px}
/* Thanh ung dung + trang chu */
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.appbar{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff}
.ab{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;flex:none;background:none;color:#fff;padding:0;border-radius:8px;text-align:left}
.brand svg{display:block;width:38px;height:38px}
.brand b{display:block;font-size:17px;line-height:1.15}
.brand small{display:block;font-size:12px;opacity:.65;font-weight:500}
.nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto}
.nav button{background:none;color:#fff;opacity:.7;font-size:15px;padding:9px 12px;border-radius:10px;white-space:nowrap}
.nav button.on{opacity:1;background:rgba(255,255,255,.13)}
.abPhai{display:flex;gap:8px;flex:none}
.abQR{background:var(--chi);color:#fff;font-size:15px;padding:9px 14px}
.abRa{background:none;color:#fff;border:1.5px solid rgba(255,255,255,.35);font-size:14px;padding:8px 12px}
.raNho{display:none;margin:22px auto 0;border:2px solid var(--line);font-size:15px}
@media (max-width:760px){.raNho{display:block}.brand span{display:none}.ab{gap:8px;padding:8px 10px}.nav button{padding:8px 8px;font-size:14px}.abRa{display:none}}
.dangNhap{max-width:440px;margin:7vh auto 0}
.dangNhap .brandL{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.dangNhap .brandL svg{width:48px;height:48px}
.dangNhap .brandL svg rect:first-child{fill:var(--ink)} .dangNhap .brandL svg text{fill:#fff}
.dangNhap .brandL b{font-size:20px;display:block}
.dangNhap .brandL span{font-size:14px;color:var(--muted)}
.chao h1{font-size:30px;margin:10px 0 2px;letter-spacing:-.3px}
.homeLuoi{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;margin-top:16px;align-items:stretch}
@media (max-width:760px){.homeLuoi{grid-template-columns:1fr}}
.oQR{display:flex;align-items:center;gap:22px;text-align:left;background:var(--chi);color:#fff;border-radius:20px;padding:24px;min-height:184px;width:100%}
.oQR svg{width:118px;height:118px;flex:none;background:#fff;border-radius:14px;padding:10px}
.oQR b{display:block;font-size:30px;line-height:1.12;letter-spacing:-.3px}
.oQR i{display:block;font-style:normal;font-size:16px;opacity:.92;margin-top:8px;font-weight:500;line-height:1.45}
@media (max-width:480px){.oQR{gap:14px;padding:18px}.oQR svg{width:84px;height:84px}.oQR b{font-size:24px}}
.homeMo{margin:0}
.homeMo h2{font-size:17px;margin-bottom:6px}
.moRow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border-radius:0;padding:12px 0;border-top:1px solid var(--line);font-weight:400}
.moRow .t{flex:1;min-width:0}
.moRow .t b{display:block;font-size:15px}
.moRow .t span{font-size:13px;color:var(--muted)}
.homeH{font-size:18px;margin:28px 2px 10px}
.oLuoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.o{position:relative;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px;min-height:156px;display:flex;flex-direction:column;font-weight:400;text-decoration:none;color:var(--ink)}
.o:hover{border-color:var(--ink)}
.o .so{position:absolute;top:12px;right:14px;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.o .kh{font-size:40px;font-weight:800;line-height:1;margin:6px 0 14px;letter-spacing:-.5px}
.o .ten{font-weight:700;font-size:16px}
.o .mt{font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.o.chi .kh{color:var(--chi)}
/* Khung ma QR toan man hinh */
.ovQR{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column}
.ovQR[hidden]{display:none}
.ovBar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.seg{display:inline-flex;background:var(--bg);border-radius:12px;padding:4px}
.seg button{background:none;font-size:15px;padding:8px 14px;border-radius:9px}
.seg button.on{background:var(--ink);color:#fff}
.ovBar .nutO{border:2px solid var(--line);font-size:15px;padding:8px 12px;margin-left:6px}
.ovThan{flex:1;display:flex;align-items:center;justify-content:center;gap:5vw;padding:20px;min-height:0}
.ovMa{width:min(70vh,50vw);aspect-ratio:1/1;flex:none}
.ovMa img,.ovMa canvas{width:100%!important;height:auto!important;display:block}
.ovChu{max-width:460px}
.ovChu h2{font-size:clamp(28px,3.6vw,48px);line-height:1.12;margin:0 0 14px;letter-spacing:-.4px}
.ovChu .phBuoc{margin:0}
.ovChu .phBuoc li{font-size:clamp(17px,1.7vw,23px)}
.ovLink{font-size:15px;color:var(--muted);margin-top:18px;word-break:break-all}
@media (orientation:portrait),(max-width:760px){.ovThan{flex-direction:column;gap:18px;justify-content:flex-start}.ovMa{width:min(84vw,56vh)}.ovChu{text-align:center}.ovChu .phBuoc{margin:0 auto;display:inline-block}}
/* Man hinh PHAT DE (chieu len may chieu) */
body.rong main{max-width:1200px}
.phatBtn{width:100%;margin-top:12px;background:var(--pri);color:#fff;font-size:17px;padding:14px}
.phNhanh{flex:none;padding:9px 14px;font-size:14px;background:var(--pri);color:#fff;border-radius:10px}
.phDau{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;background:var(--ink);color:#fff;border-radius:18px;padding:18px 22px;margin-bottom:12px}
.phDau h1{font-size:28px;margin:4px 0 0;line-height:1.2}
.phMa{font-size:13px;opacity:.7;letter-spacing:.6px;text-transform:uppercase;font-weight:700}
.phLuoi{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.phLuoi{grid-template-columns:1fr}}
.phQR{text-align:center;padding:16px 22px}
.phLopTo{font-size:18px;color:var(--muted);font-weight:600}
.phLopTo b{display:block;font-size:44px;color:var(--ink);line-height:1.05;letter-spacing:.5px}
.phMaQR{width:min(420px,100%,calc(100vh - 460px));min-width:min(260px,100%);aspect-ratio:1/1;margin:14px auto 6px;padding:14px;background:#fff;border:3px solid var(--ink);border-radius:18px}
.phMaQR img,.phMaQR canvas{width:100%!important;height:auto!important;display:block}
.phMaQR.tat{aspect-ratio:auto;min-height:120px;width:min(400px,100%);display:flex;align-items:center;justify-content:center;color:var(--muted);border:3px dashed var(--line);font-size:17px;padding:24px}
.phBuoc{text-align:left;margin:8px auto 0;max-width:430px;padding:0;list-style:none;counter-reset:b}
.phBuoc li{counter-increment:b;display:flex;gap:10px;align-items:baseline;margin:9px 0;font-size:17px;line-height:1.35}
.phBuoc li:before{content:counter(b);flex:none;width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.phMaGV{margin-top:14px;font-size:14px;color:var(--muted)}
.phMaGV button{padding:5px 10px;font-size:13px;border:2px solid var(--line);margin-left:6px}
.phMaGV.thieu{color:var(--warn);background:var(--warnbg);border-radius:10px;padding:8px 10px}
.phMaGV input{width:140px;font-size:16px;padding:6px 10px;margin-left:6px}
.phTre{border:2px solid var(--line);font-size:15px;margin-top:10px}
.phTT{padding:20px}
.phTrang{display:inline-block;font-weight:800;font-size:14px;letter-spacing:.5px;padding:6px 12px;border-radius:999px}
.phTrang.cho{background:var(--warnbg);color:var(--warn)}
.phTrang.mo{background:var(--okbg);color:var(--ok)}
.phTrang.tat{background:var(--off);color:var(--muted)}
.phSo{display:flex;align-items:baseline;gap:10px;margin:14px 0 4px}
.phSo b{font-size:76px;line-height:1;font-variant-numeric:tabular-nums}
.phSo span{font-size:20px;color:var(--muted)}
.phGio{font-size:88px;font-weight:800;line-height:1;margin:14px 0 4px;font-variant-numeric:tabular-nums}
.phGio.it{color:var(--bad)}
.phGio.het{font-size:34px;color:var(--bad)}
.phBa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.phBa div{background:var(--bg);border-radius:12px;padding:10px 6px;text-align:center}
.phBa b{display:block;font-size:30px;font-variant-numeric:tabular-nums}
.phBa span{font-size:13px;color:var(--muted)}
.phChip{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;max-height:300px;overflow:auto}
.phChip span{font-size:14px;border:2px solid var(--line);border-radius:999px;padding:3px 10px;background:#fff}
.phChip span.xong{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.phChip span b{margin-right:4px;font-variant-numeric:tabular-nums}
.phNut{width:100%;margin-top:14px;font-size:21px;padding:18px;border-radius:14px;color:#fff;background:var(--pri)}
.phNut.batdau{background:var(--ok)}
.phNut.dongde{background:var(--bad)}
.phNut:disabled,.phNut2:disabled{opacity:.5}
.phNut2{width:100%;margin-top:10px;border:2px solid var(--line);font-size:16px}
.phCap{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
.phRong{color:var(--muted);font-size:16px;margin:8px 0}

</style>

<main>

<section id="scrLogin" class="card dangNhap">
  <div class="brandL"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="8" fill="#fff"/><path d="M1 31H39A8 8 0 0 1 31 39H9A8 8 0 0 1 1 31Z" fill="#b8235a"/><rect x="1" y="1" width="38" height="38" rx="8" fill="none" stroke="#fff" stroke-width="2"/><text x="20" y="25" text-anchor="middle" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="17" font-weight="800" fill="#172033">Hh</text></svg><div><b>Kiểm tra Hóa học</b><span>Trang giáo viên</span></div></div>
  <h1>Đăng nhập</h1>

<section id="scrHome" class="hidden">

  <div class="homeLuoi">
    <button class="oQR" id="oQR"><svg viewBox="0 0 29 29" aria-hidden="true" shape-rendering="crispEdges"><path fill="#172033" d="M0 0h7v7H0zM22 0h7v7h-7zM0 22h7v7H0z"/><path fill="#fff" d="M1 1h5v5H1zM23 1h5v5h-5zM1 23h5v5H1z"/><path fill="#172033" d="M2 2h3v3H2zM24 2h3v3h-3zM2 24h3v3H2zM9 0h2v2H9zM13 1h3v2h-3zM9 4h4v2H9zM17 3h2v4h-2zM9 9h3v3H9zM14 8h2v2h-2zM18 9h4v2h-4zM24 9h2v3h-2zM0 9h2v2H0zM3 12h3v2H3zM12 13h4v3h-4zM19 14h3v3h-3zM25 15h4v2h-4zM9 17h2v4H9zM14 19h3v2h-3zM22 20h3v3h-3zM9 24h4v2H9zM15 23h2v4h-2zM19 25h3v4h-3zM25 26h4v3h-4z"/></svg><span><b>Mã QR vào thi</b><i>Chiếu lên cho học sinh quét: các em vào trang chọn lớp và điền thông tin như mọi khi.</i></span></button>

    <div class="loc" id="locLop" style="margin-top:12px"></div>

  </div>

</section>

  <div id="motHS"></div>

</main>

<div class="ovQR" id="ovQR" hidden role="dialog" aria-modal="true" aria-label="Mã QR cho học sinh">
  <div class="ovBar">
    <div class="seg" id="qrSeg"><button data-q="lam" class="on">Vào làm bài</button><button data-q="xem">Xem lại bài</button></div>
    <div><button class="nutO" id="qrToan">⛶ Toàn màn hình</button><button class="nutO" id="qrDong">✕ Đóng</button></div>
  </div>
  <div class="ovThan">
    <div class="ovMa" id="qrMa"></div>
    <div class="ovChu"><h2 id="qrTieuDe"></h2><ol class="phBuoc" id="qrBuoc"></ol><p class="ovLink" id="qrLink"></p></div>
  </div>

<script async src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="cau-hinh-lop.js"></script>
<script>
(function () {
  var DS = window.DS_LOP || [];
  var MA = '', DOT = [], dotXem = null, hen = null, LECH = 0;
  function $(id) { return document.getElementById(id); }
  function man(id) {
    ['scrLogin', 'scrHome', 'scrDot', 'scrTheo', 'scrPhat', 'scrHoSo', 'scrMotHS'].forEach(function (k) { $(k).classList.toggle('hidden', k !== id); });
    document.body.classList.toggle('rong', id === 'scrPhat' || id === 'scrHome'); window.scrollTo(0, 0);
    $('appbar').classList.toggle('hidden', id === 'scrLogin');
    var muc = id === 'scrHome' ? 'home' : /scrHoSo|scrMotHS/.test(id) ? 'hoso' : 'dot';
    [].forEach.call(document.querySelectorAll('.nav button'), function (b) { b.classList.toggle('on', b.getAttribute('data-di') === muc); });
  }
  function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function chuan(s) { return String(s || '').toUpperCase().replace(/\s+/g, ''); }
  // Doi toi da 30 giay moi lop; qua thoi gian thi bao loi thay vi treo "Dang tai..."
  function goi(url, du) {
    var hetGio = new Promise(function (_, loi) { setTimeout(function () { loi(new Error('quá 30 giây không trả lời')); }, 30000); });
    return Promise.race([fetch(url, { method: 'POST', body: JSON.stringify(du) }).then(function (r) { return r.json(); }), hetGio]);
  }
  // Dot/kho de dung chung: goi lan luot cac lop den khi co lop tra loi
  function goiBatKy(du, i) {
    i = i || 0;
    if (i >= DS.length) return Promise.reject(new Error('Không kết nối được sổ theo dõi nào.'));
    return goi(DS[i].url, du).then(function (j) {
      if (!j.ok && j.loi !== 'ma' && /Yeu cau khong hop le/.test(j.msg || '')) return goiBatKy(du, i + 1);
      return j;
    }).catch(function () { return goiBatKy(du, i + 1); });
  }
  function lopCuaDot(d) {
    var l = chuan(d.lop);
    if (!l || l === 'TATCA' || l === 'TẤTCẢ') return DS.slice();
    var ds = l.split(',');
    return DS.filter(function (x) { return ds.indexOf(chuan(x.ten)) >= 0; });
  }
  function gio(iso) { if (!iso) return ''; var d = new Date(iso); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function diem(x) { return String(x).replace('.', ','); }
  function ngayGio(iso) { if (!iso) return ''; var d = new Date(iso); return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + ' ' + gio(iso); }

  // ---------- Dang nhap ----------
  var KMA = 'gv_ma' + (window.LAM_DEMO ? '_demo' : '');
  try { MA = sessionStorage.getItem(KMA) || ''; } catch (e) {}
  $('btnVao').onclick = function () {
    var m = $('ma').value.trim();
    if (!m) { $('msg').textContent = 'Thầy/cô chưa nhập mã.'; return; }
    vao(m);
  };
  $('ma').onkeydown = function (e) { if (e.key === 'Enter') $('btnVao').click(); };
  function vao(m) {
    $('msg').textContent = ''; $('btnVao').disabled = true; $('btnVao').textContent = 'Đang kiểm tra...';
    goiBatKy({ action: 'gv_dot', ma: m }).then(function (j) {
      $('btnVao').disabled = false; $('btnVao').textContent = 'Vào';
      if (!j.ok) {
        try { sessionStorage.removeItem(KMA); } catch (e) {}
        $('msg').textContent = j.loi === 'ma' ? 'Mã quản lý chưa đúng.' : 'Lỗi: ' + (j.msg || '') + '. Sổ theo dõi đã cập nhật mã mới chưa?';
        man('scrLogin'); return;
      }
      MA = m; try { sessionStorage.setItem(KMA, m); } catch (e) {}
      $('ma').value = ''; DOT = j.dot; if (j.bayGio) LECH = j.bayGio - Date.now(); man('scrHome'); veHome(); taiDaThi();
    }).catch(function (e) { $('btnVao').disabled = false; $('btnVao').textContent = 'Vào'; $('msg').textContent = e.message; man('scrLogin'); });
  }
  $('btnRa').onclick = function () { MA = ''; try { sessionStorage.removeItem(KMA); } catch (e) {} man('scrLogin'); };
  $('raNho').onclick = function () { $('btnRa').click(); };
  function diDen(k) {
    clearTimeout(hen); if (typeof PH !== 'undefined') { clearTimeout(PH.hen); PH.luot++; }
    if (k === 'home') { man('scrHome'); veHome(); }
    else if (k === 'dot') { man('scrDot'); veDot(); if (!DATHI) taiDaThi(); }
    else $('btnHoSo').onclick();
  }
  [].forEach.call(document.querySelectorAll('[data-di]'), function (b) { if (b.id !== 'btnHoSo') b.onclick = function () { diDen(b.getAttribute('data-di')); }; });

  // ---------- Danh sach de ----------
  function conLaiDe(d) {
    if (d.tt !== 'MO' || !d.batdauluc) return null;
    return Math.round((d.batdauluc + d.phut * 60000 - (Date.now() + LECH)) / 1000);
  }
  function mmss(g) { g = Math.max(0, g); return Math.floor(g / 60) + ':' + ('0' + g % 60).slice(-2); }
  function nutCongTac(d, coNutTheo) {
    var chip = d.tt === 'MO' ? '<span class="chip mo">ĐANG LÀM BÀI</span>' : d.tt === 'CHO' ? '<span class="chip cho">PHÒNG CHỜ</span>' : '<span class="ttDong">đề đang đóng</span>';
    var h = '<div class="dh"><div><h2>' + esc(d.ten) + '</h2><div class="ma">' + esc(d.madot) + ' · ' + d.phut + ' phút · Lớp: ' + esc(d.lop) + '</div></div>' + chip + '</div>';
    var g = conLaiDe(d);
    if (g !== null) h += '<div class="dem" data-madot="' + esc(d.madot) + '">' + (g > 0 ? 'Còn lại <b>' + mmss(g) + '</b>' : '<b>Đã hết giờ</b> – bấm Đóng đề') + '</div>';
    h += '<div class="sw">';
    if (d.tt === 'DONG') {
      h += '<button data-gt="CHO" class="chinh"><b>① Mở phòng chờ</b>HS điền thông tin rồi đợi</button>' +
           '<button data-gt="MO"><b>Bắt đầu ngay</b>Không qua phòng chờ</button>';
    } else if (d.tt === 'CHO') {
      h += '<button data-gt="MO" class="chinh batdau"><b>② ▶ Bắt đầu làm bài</b>Tất cả HS đang chờ vào cùng lúc</button>' +
           '<button data-gt="DONG"><b>Hủy phòng chờ</b>Đóng lại</button>';
    } else {
      h += '<button data-gt="DONG" class="bat"><b>③ ■ Đóng đề</b>Không cho vào thêm</button>';
    }
    h += '<button data-t="xemlai" class="' + (d.xemlai ? 'bat' : '') + '"><b>' + (d.xemlai ? '● Cho xem lại' : '○ Chưa cho xem lại') + '</b>' + (d.xemlai ? 'Bấm để tắt' : 'Bấm khi các lớp đã thi xong') + '</button></div>';
    if (d.tt !== 'DONG' && d.xemlai) h += '<div class="canh">⚠ Đề đang mở và đang cho xem lại cùng lúc: học sinh đã nộp có thể xem đáp án trong khi bạn khác còn làm.</div>';
    if (coNutTheo) h += '<button class="theo">Theo dõi ' + (d.tt === 'CHO' ? 'phòng chờ' : 'nộp bài') + ' ▶</button>';
    return h;
  }
  function ganCongTac(el, d, sau) {
    [].forEach.call(el.querySelectorAll('.sw button'), function (b) {
      b.onclick = function () {
        var du;
        if (b.getAttribute('data-t') === 'xemlai') du = { truong: 'xemlai', giatri: !d.xemlai };
        else {
          var gt = b.getAttribute('data-gt');
          if (gt === 'MO' && !confirm('Bắt đầu làm bài "' + d.ten + '"?\nĐồng hồ ' + d.phut + ' phút bắt đầu chạy cho tất cả học sinh.')) return;
          if (gt === 'DONG' && d.tt === 'MO' && !confirm('Đóng đề? Học sinh chưa vào sẽ không vào được nữa (em đang làm vẫn nộp được).')) return;
          du = { truong: 'trangthai', giatri: gt };
        }
        [].forEach.call(el.querySelectorAll('.sw button'), function (x) { x.disabled = true; });
        b.querySelector('b').textContent = 'Đang lưu...';
        goiBatKy({ action: 'gv_dat', ma: MA, madot: d.madot, truong: du.truong, giatri: du.giatri }).then(function (j) {
          if (!j.ok) { alertLoi(el, j.msg); return; }
          DOT = j.dot; if (j.bayGio) LECH = j.bayGio - Date.now(); sau();
        }).catch(function (e) { alertLoi(el, e.message); });
      };
    });
  }
  function alertLoi(el, m) {
    var x = document.createElement('div'); x.className = 'loi'; x.textContent = 'Chưa lưu được: ' + (m || '') + '. Thử lại.';
    el.appendChild(x); [].forEach.call(el.querySelectorAll('.sw button'), function (b) { b.disabled = false; });
  }
  // ---------- Danh sach de: chia theo khoi, trong khoi chia 15 phut / 45 phut ----------
  var khoiChon = null, moRong = null, DATHI = null;
  try { khoiChon = localStorage.getItem('gv_khoi'); } catch (e) {}
  function khoiCua(d) { var m = /^H(\d+)-/i.exec(d.madot) || /H[óo]a\s*(\d+)/i.exec(d.ten); return m ? m[1] : 'khac'; }
  function tenNgan(d) { return String(d.ten).replace(/^H[óo]a\s*\d+\s*[–-]\s*/i, ''); }
  function dathiHtml(d) {
    if (!DATHI) return '<span class="dt">Đang kiểm tra lớp đã thi…</span>';
    var x = DATHI[d.madot];
    if (!x || !Object.keys(x).length) return '<span class="dt">Chưa lớp nào thi</span>';
    return '<span class="dt ok">✓ Đã thi: ' + Object.keys(x).sort().map(function (l) { return esc(l) + ' (' + x[l] + ' em)'; }).join(' · ') + '</span>';
  }
  function chipTT(d) { return d.tt === 'MO' ? '<span class="chip mo">ĐANG LÀM BÀI</span>' : d.tt === 'CHO' ? '<span class="chip cho">PHÒNG CHỜ</span>' : ''; }
  function theDot(d, gon) {
    var el = document.createElement('div'); el.className = 'card dot' + (d.tt !== 'DONG' ? ' moNoi' : '');
    el.innerHTML = nutCongTac(d, true) + '<div class="dtWrap">' + dathiHtml(d) + '</div>' +
      (gon ? '<button class="thuGon">▴ Thu gọn</button>' : '');
    if (gon) { var x = document.createElement('button'); x.className = 'dongX'; x.title = 'Thu gọn'; x.textContent = '✕'; x.onclick = function () { moRong = null; veDot(); }; el.insertBefore(x, el.firstChild); }
    ganCongTac(el, d, veDot);
    var pb = document.createElement('button'); pb.className = 'phatBtn';
    pb.textContent = '📺 Màn hình chiếu: mã QR riêng của đề + đồng hồ';
    pb.onclick = function () { phat(d); };
    el.insertBefore(pb, el.querySelector('.sw'));
    el.querySelector('.theo').onclick = function () { dotXem = d.madot; moTheoDoi(); };
    if (gon) el.querySelector('.thuGon').onclick = function () { moRong = null; veDot(); };
    return el;
  }
  function veDot() {
    var box = $('dsDot'); box.innerHTML = '';
    var dangMo = DOT.filter(function (d) { return d.tt !== 'DONG'; });
    $('soDot').textContent = DOT.length + ' đề · ' + dangMo.length + ' đang mở';
    // Tab khoi
    var cacKhoi = []; DOT.forEach(function (d) { var k = khoiCua(d); if (cacKhoi.indexOf(k) < 0) cacKhoi.push(k); });
    cacKhoi.sort(function (a, b) { return (a === 'khac') - (b === 'khac') || Number(a) - Number(b); });
    if (cacKhoi.indexOf(khoiChon) < 0) khoiChon = cacKhoi[cacKhoi.length - 1] || null;
    var tab = $('locDot'); tab.innerHTML = '';
    cacKhoi.forEach(function (k) {
      var b = document.createElement('button'); b.className = k === khoiChon ? 'on' : '';
      var n = DOT.filter(function (d) { return khoiCua(d) === k; }).length;
      b.innerHTML = (k === 'khac' ? 'Khác' : 'Hóa ' + k) + '<small>' + n + '</small>';
      b.onclick = function () { khoiChon = k; moRong = null; try { localStorage.setItem('gv_khoi', k); } catch (e) {} veDot(); };
      tab.appendChild(b);
    });
    // De dang mo (moi khoi) luon o tren cung
    if (dangMo.length) {
      var t = document.createElement('div'); t.className = 'nhom'; t.textContent = '● Đang mở'; box.appendChild(t);
      dangMo.forEach(function (d) { box.appendChild(theDot(d, false)); });
    }
    var ds = DOT.filter(function (d) { return khoiCua(d) === khoiChon && d.tt === 'DONG'; });
    [{ ten: 'Khảo bài nhanh · 7 phút', loc: function (d) { return d.phut <= 10; } },
     { ten: 'Khảo bài · 15 phút', loc: function (d) { return d.phut > 10 && d.phut <= 20; } },
     { ten: 'Kiểm tra · 45 phút', loc: function (d) { return d.phut > 20; } }].forEach(function (g) {
      var dd = ds.filter(g.loc); if (!dd.length) return;
      var t = document.createElement('div'); t.className = 'nhom'; t.textContent = g.ten + ' (' + dd.length + ' đề)'; box.appendChild(t);
      var khung = document.createElement('div'); khung.className = 'dsGon';
      dd.forEach(function (d) {
        if (moRong === d.madot) { khung.appendChild(theDot(d, true)); return; }
        var r = document.createElement('button'); r.className = 'dong';
        r.innerHTML = '<span class="tt2"><b>' + esc(tenNgan(d)) + '</b><span class="ma">' + esc(d.madot) + ' · ' + d.phut + ' phút · ' + esc(d.lop) +
          (d.xemlai ? ' · <span style="color:var(--ok)">đang cho xem lại</span>' : '') + '</span>' + dathiHtml(d) + '</span><span class="mui">▸</span>';
        r.onclick = function () { moRong = d.madot; veDot(); };
        khung.appendChild(r);
      });
      box.appendChild(khung);
    });

      : '<li><span>Mở <b>Camera</b> trên iPad, quét mã</span></li><li><span>Chọn <b>lớp</b>, gõ <b>2 số cuối</b> số báo danh và <b>mã giáo viên</b></span></li><li><span>Bấm <b>Tìm tên</b> → <b>Đúng tên – Bắt đầu làm bài</b></span></li>';

  function dongQR() { $('ovQR').hidden = true; if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }

  // ---------- PHAT DE: man hinh chieu len may chieu – ma QR cho HS vao thang lop + de ----------

  }
  function taiPhat() {
    clearTimeout(PH.hen);
    var d = phDe(), l = phLopHT(), luot = ++PH.luot;
    if (!d || !l || $('scrPhat').classList.contains('hidden')) return;
    goi(l.url, { action: 'gv_theodoi', ma: MA, madot: d.madot }).then(function (j) {
      if (luot !== PH.luot) return;
      PH.dl = j.ok ? j : { loi: j.msg || 'Lỗi' }; PH.luc = Date.now(); veTT();
    }).catch(function (e) { if (luot === PH.luot && !PH.dl) { PH.dl = { loi: 'Không kết nối được (' + e.message + ')' }; veTT(); } }).then(function () {
      var dd = phDe();
      var conLam = PH.dl && PH.dl.hs && PH.dl.hs.some(function (x) { return x.tt === 'danglam'; });
      if (luot !== PH.luot || !dd || (dd.tt === 'DONG' && !conLam) || document.hidden || $('scrPhat').classList.contains('hidden')) return;
      PH.hen = setTimeout(taiPhat, dd.tt === 'CHO' ? 5000 : dd.tt === 'MO' ? 10000 : 15000);
    });
  }
  function vePhat() {
    var d = phDe(); if (!d) return;
    var lops = lopCuaDot(d), l = phLopHT();
    $('phDau').innerHTML = '<div><div class="phMa">' + esc(d.madot) + ' · ' + d.phut + ' phút</div><h1>' + esc(d.ten) + '</h1></div>';
    var tb = $('phLop'); tb.innerHTML = '';

      var b = document.createElement('button'); b.textContent = 'Lớp ' + x.ten; b.className = x.ten === PH.lop ? 'on' : '';
      b.onclick = function () { if (PH.lop === x.ten) return; PH.lop = x.ten; PH.dl = null; try { localStorage.setItem('gv_lop', x.ten); } catch (e) {} vePhat(); taiPhat(); };
      tb.appendChild(b);
    });
    var q = $('phQR');
    if (!l) { q.innerHTML = '<div class="loi">Cột Lop của đề này không khớp lớp nào trong danh sách lớp.</div>'; veTT(); return; }
    var hien = d.tt !== 'MO' || PH.hienQR;
    var h = '<div class="phLopTo">Học sinh lớp<b>' + esc(l.ten) + '</b></div>';
    if (hien) h += '<div class="phMaQR" id="phMaQR"></div>';
    else if (d.tt === 'MO') h += '<div class="phMaQR tat">Đang làm bài · mã QR đã ẩn</div><button class="btn2 phTre" id="phTre">Hiện mã QR cho em vào trễ</button>';
    if (hien) h += '<ol class="phBuoc"><li><span>Mở <b>Camera</b> trên iPad, quét mã</span></li><li><span>Gõ <b>2 số cuối</b> số báo danh → <b>Tìm tên</b></span></li><li><span>Bấm <b>Đúng tên – Bắt đầu làm bài</b> rồi chờ giáo viên phát đề</span></li></ol>' +
      (d.tt === 'MO' ? '<button class="btn2 phTre" id="phTre">Ẩn mã QR</button>' : '');
    if (PH.suaMa) h += '<div class="phMaGV">Mã giáo viên gắn vào QR <input id="phMaMoi" type="password" inputmode="numeric" autocomplete="off"><button id="phMaLuu">Lưu</button><button id="phMaHuy">Hủy</button>' +
      '<div style="margin-top:6px">Mã lưu trên máy này, không hiện lên màn hình. Để trống = học sinh tự gõ mã.</div></div>';
    else h += MAQR ? '<div class="phMaGV">🔑 Đã gắn mã giáo viên vào QR – học sinh không cần gõ mã<button id="phMaDoi">Đổi</button></div>'
                   : '<div class="phMaGV thieu">Chưa gắn mã giáo viên: học sinh quét xong vẫn phải gõ mã.<button id="phMaDoi">Gắn mã</button></div>';
    q.innerHTML = h;
    if (hien) veQR($('phMaQR'), linkQR(d, l));
    if ($('phTre')) $('phTre').onclick = function () { PH.hienQR = !PH.hienQR; vePhat(); };
    if ($('phMaDoi')) $('phMaDoi').onclick = function () { PH.suaMa = true; vePhat(); $('phMaMoi').focus(); };
    if ($('phMaHuy')) $('phMaHuy').onclick = function () { PH.suaMa = false; vePhat(); };
    if ($('phMaLuu')) {
      $('phMaMoi').onkeydown = function (e) { if (e.key === 'Enter') $('phMaLuu').click(); };

        MAQR = $('phMaMoi').value.trim(); try { if (MAQR) localStorage.setItem(KQR, MAQR); else localStorage.removeItem(KQR); } catch (e) {}
        PH.suaMa = false; vePhat();
      };

    veTT();
  }
  function phGioHtml(d) {
    var g = conLaiDe(d);
    if (g === null) return '';

      }).join('') + '</div>' : '';
    }

        '<div class="phSo"><b>' + (hs ? dem.dangcho : '…') + '</b><span>' + (hs ? '/ ' + si + ' em đã vào' : 'đang tải danh sách…') + '</span></div>' +
        (hs ? (dem.dangcho ? chip(hs.filter(function (x) { return x.tt === 'dangcho'; }).sort(sx), function () { return false; }) : '<p class="phRong">Chưa có em nào vào. Học sinh quét mã QR bên cạnh.</p>') : '') +
        (dem.danop ? '<p class="phRong">' + dem.danop + ' em đã nộp ở ca trước.</p>' : '') +

        '<button class="phNut dongde" data-gt="DONG">■ Đóng đề</button>' +
        '<button class="phNut2" id="phKQ">Xem điểm và phân tích câu sai ▶</button>';
    } else {
      h = '<span class="phTrang tat">○ ĐỀ ĐANG ĐÓNG</span>' +
        (hs && (dem.danop || dem.danglam) ? '<div class="phBa"><div><b>' + dem.danop + '</b><span>Đã nộp</span></div><div><b>' + dem.danglam + '</b><span>Đang làm (vẫn nộp được)</span></div><div><b>' + (dem.chua + dem.dangcho) + '</b><span>Chưa vào</span></div></div>'
