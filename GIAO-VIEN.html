<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Giáo viên – Kiểm tra</title>
<style>
:root{--ink:#1a1a2e;--muted:#5b6175;--line:#d9dce5;--bg:#f4f5f9;--card:#fff;--pri:#1f5fbf;--ok:#1e8e3e;--okbg:#e8f5ec;--warn:#a06b00;--warnbg:#fff4d6;--bad:#c5221f;--off:#eceef3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px}
main{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.hidden{display:none!important}
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 8px rgba(0,0,0,.06);padding:16px;margin-bottom:12px}
h1{font-size:23px;margin:4px 0}
h2{font-size:19px;margin:0}
.sub{color:var(--muted);font-size:15px;margin:2px 0 0}
label{display:block;font-weight:600;margin:14px 0 6px}
input{width:100%;font-size:20px;padding:12px 14px;border:2px solid var(--line);border-radius:12px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;color:var(--ink);background:#fff}
.btn{background:var(--pri);color:#fff;width:100%;margin-top:16px}
.btn2{border:2px solid var(--line)}
.msg{margin-top:10px;min-height:20px;font-weight:600;color:var(--bad)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.top button{padding:9px 12px;font-size:15px}
.loc{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap}
.loc button{border:2px solid var(--line);padding:8px 12px;font-size:15px}
.loc button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dot .dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dot .ma{font-size:14px;color:var(--muted)}
.sw{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sw button{flex:1;min-width:150px;border:2px solid var(--line);text-align:left;padding:10px 12px;font-size:15px}
.sw button b{display:block;font-size:17px}
.sw button.bat{border-color:var(--ok);background:var(--okbg)}
.sw button.bat b{color:var(--ok)}
.sw button:disabled{opacity:.5}
.canh{margin-top:10px;font-size:14px;color:var(--warn);background:var(--warnbg);border-radius:8px;padding:8px 10px}
.dot .theo{margin-top:10px;width:100%;background:var(--ink);color:#fff}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--off);color:var(--muted);white-space:nowrap}
.chip.mo{background:var(--okbg);color:var(--ok)}
.chip.cho{background:var(--warnbg);color:var(--warn)}
.sw button.chinh{border-color:var(--pri);background:#eaf1fc}
.sw button.chinh b{color:var(--pri)}
.sw button.batdau{border-width:3px}
.dem{margin-top:10px;font-size:18px;text-align:center;background:var(--bg);border-radius:10px;padding:8px}
.dem b{font-size:24px;font-variant-numeric:tabular-nums}
.tt.dangcho{color:var(--pri)}
.tk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.tk div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.tk b{display:block;font-size:24px}
.tk span{font-size:13px;color:var(--muted)}
.hs{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line)}
.hs .so{flex:none;width:30px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.hs .ten{flex:1;min-width:0}
.hs .tt{flex:none;text-align:right;font-size:14px;font-weight:700}
.tt.danop{color:var(--ok)}
.tt.danglam{color:var(--warn)}
.tt.chua{color:var(--muted);font-weight:500}
.tt a{color:inherit}
.lan{font-size:12px;font-weight:700;color:var(--warn);margin-left:6px}
.xem{font-size:12px;font-weight:600;color:var(--ok)}
.xem.chua{color:var(--muted)}
.capnhat{font-size:13px;color:var(--muted);text-align:center;margin:6px 0}
.loi{color:var(--bad);font-weight:600;margin-top:8px}
/* Khoi 5 - ho so */
.nutTop{display:flex;gap:8px}
.bang{overflow-x:auto;margin:10px -16px 0;padding:0 16px;-webkit-overflow-scrolling:touch}
.bang table{border-collapse:separate;border-spacing:0;font-size:15px;min-width:100%}
.bang th,.bang td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.bang th{font-size:13px;color:var(--muted);position:sticky;top:0;background:var(--card)}
.bang .tn{position:sticky;left:0;background:var(--card);text-align:left;max-width:170px;overflow:hidden;text-overflow:ellipsis;z-index:1}
.bang .tn button{padding:0;background:none;font-weight:600;color:var(--pri);text-align:left;font-size:15px;border-radius:0}
.bang td a{color:var(--ink);text-decoration:none;font-weight:700}
.bang td.thap a{color:var(--bad);text-decoration:underline}
.bang td.tb{font-weight:800;background:var(--bg)}
.bang tr.tblop td{font-weight:700;color:var(--muted);border-bottom:0}
.bang .lan2{font-size:10px;color:var(--warn);vertical-align:super}
.chuthich{font-size:14px;color:var(--muted);margin-top:10px;line-height:1.5}
.chuthich b{color:var(--ink)}
.tk3{grid-template-columns:repeat(3,1fr)}
.bai{display:flex;gap:10px;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}
.bai .tb2{flex:1;min-width:0}
.bai .tb2 div{font-size:14px;color:var(--muted)}
.bai .d{flex:none;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.bai .d.thap{color:var(--bad)}
.bai a.pdf{flex:none;font-size:14px;font-weight:700;color:var(--pri);border:2px solid var(--line);border-radius:10px;padding:6px 10px;text-decoration:none}
.bieudo svg{width:100%;height:auto;display:block}
.ghiOK{color:var(--ok);font-weight:600;margin-top:8px}
.bang td.vg{color:var(--warn);font-weight:800}
.vgRow{padding:10px 2px;border-top:1px solid var(--line)}
.vgRow .vt{font-weight:700}
.vgRow .vs{font-size:14px;color:var(--warn);font-weight:600;margin-top:2px}
.vgBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.vgBtns button{border:2px solid var(--line);padding:7px 12px;font-size:14px}
.vgBtns input{flex:1;min-width:150px;font-size:15px;padding:8px 10px;border-radius:10px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--warn);background:var(--warnbg);border-radius:20px;padding:2px 8px;margin-left:6px}
.btnVang{margin-left:8px;border:2px solid var(--line);padding:3px 8px;font-size:12px;border-radius:8px}
</style>
</head>
<body>
<main>

<section id="scrLogin" class="card">
  <h1>Trang giáo viên</h1>
  <p class="sub">Mở/đóng đề, cho xem lại bài và theo dõi học sinh nộp bài.</p>
  <label for="ma">Mã quản lý</label>
  <input id="ma" type="password" inputmode="numeric" autocomplete="off">
  <button class="btn" id="btnVao">Vào</button>
  <div class="msg" id="msg"></div>
</section>

<section id="scrDot" class="hidden">
  <div class="top"><div><h1>Các đề kiểm tra</h1><p class="sub" id="soDot"></p></div><div class="nutTop"><button class="btn2" id="btnHoSo">📋 Hồ sơ HS</button><button class="btn2" id="btnRa">Thoát</button></div></div>
  <div class="loc" id="locDot">
    <button data-l="mo" class="on">Đang mở</button><button data-l="all">Tất cả</button>
  </div>
  <div id="dsDot"></div>
</section>

<section id="scrTheo" class="hidden">
  <div class="top"><button class="btn2" id="btnLai">◀ Các đề</button><button class="btn2" id="btnLamMoi">↻ Làm mới</button></div>
  <div class="card dot" id="theoDot"></div>
  <div class="capnhat" id="capNhat"></div>
  <div id="dsLop"></div>
</section>

<section id="scrHoSo" class="hidden">
  <div class="top"><button class="btn2" id="btnLai2">◀ Các đề</button><button class="btn2" id="btnTaiHS">↻ Làm mới</button></div>
  <div class="card">
    <h1>Hồ sơ học sinh</h1>
    <p class="sub">Bảng điểm từng lớp. Bấm vào tên để xem tiến bộ của em đó, bấm vào điểm để mở bài làm (PDF).</p>
    <div class="loc" id="locLop" style="margin-top:12px"></div>
  </div>
  <div id="hoSo"></div>
</section>

<section id="scrMotHS" class="hidden">
  <div class="top"><button class="btn2" id="btnLai3">◀ Bảng điểm</button></div>
  <div id="motHS"></div>
</section>

</main>
<script src="cau-hinh-lop.js"></script>
<script>
(function () {
  var DS = window.DS_LOP || [];
  var MA = '', DOT = [], loc = 'mo', dotXem = null, hen = null, LECH = 0;
  function $(id) { return document.getElementById(id); }
  function man(id) { ['scrLogin', 'scrDot', 'scrTheo', 'scrHoSo', 'scrMotHS'].forEach(function (k) { $(k).classList.toggle('hidden', k !== id); }); window.scrollTo(0, 0); }
  function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function chuan(s) { return String(s || '').toUpperCase().replace(/\s+/g, ''); }
  // Doi toi da 30 giay moi lop; qua thoi gian thi bao loi thay vi treo "Dang tai..."
  function goi(url, du) {
    var hetGio = new Promise(function (_, loi) { setTimeout(function () { loi(new Error('quá 30 giây không trả lời')); }, 30000); });
    return Promise.race([fetch(url, { method: 'POST', body: JSON.stringify(du) }).then(function (r) { return r.json(); }), hetGio]);
  }
  // Dot/kho de dung chung: goi lan luot cac lop den khi co lop tra loi
  function goiBatKy(du, i) {
    i = i || 0;
    if (i >= DS.length) return Promise.reject(new Error('Không kết nối được sổ theo dõi nào.'));
    return goi(DS[i].url, du).then(function (j) {
      if (!j.ok && j.loi !== 'ma' && /Yeu cau khong hop le/.test(j.msg || '')) return goiBatKy(du, i + 1);
      return j;
    }).catch(function () { return goiBatKy(du, i + 1); });
  }
  function lopCuaDot(d) {
    var l = chuan(d.lop);
    if (!l || l === 'TATCA' || l === 'TẤTCẢ') return DS.slice();
    var ds = l.split(',');
    return DS.filter(function (x) { return ds.indexOf(chuan(x.ten)) >= 0; });
  }
  function gio(iso) { if (!iso) return ''; var d = new Date(iso); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function diem(x) { return String(x).replace('.', ','); }
  function ngayGio(iso) { if (!iso) return ''; var d = new Date(iso); return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + ' ' + gio(iso); }

  // ---------- Dang nhap ----------
  try { MA = sessionStorage.getItem('gv_ma') || ''; } catch (e) {}
  $('btnVao').onclick = function () {
    var m = $('ma').value.trim();
    if (!m) { $('msg').textContent = 'Thầy/cô chưa nhập mã.'; return; }
    vao(m);
  };
  $('ma').onkeydown = function (e) { if (e.key === 'Enter') $('btnVao').click(); };
  function vao(m) {
    $('msg').textContent = ''; $('btnVao').disabled = true; $('btnVao').textContent = 'Đang kiểm tra...';
    goiBatKy({ action: 'gv_dot', ma: m }).then(function (j) {
      $('btnVao').disabled = false; $('btnVao').textContent = 'Vào';
      if (!j.ok) {
        try { sessionStorage.removeItem('gv_ma'); } catch (e) {}
        $('msg').textContent = j.loi === 'ma' ? 'Mã quản lý chưa đúng.' : 'Lỗi: ' + (j.msg || '') + '. Sổ theo dõi đã cập nhật mã mới chưa?';
        man('scrLogin'); return;
      }
      MA = m; try { sessionStorage.setItem('gv_ma', m); } catch (e) {}
      $('ma').value = ''; DOT = j.dot; if (j.bayGio) LECH = j.bayGio - Date.now(); veDot(); man('scrDot');
    }).catch(function (e) { $('btnVao').disabled = false; $('btnVao').textContent = 'Vào'; $('msg').textContent = e.message; man('scrLogin'); });
  }
  $('btnRa').onclick = function () { MA = ''; try { sessionStorage.removeItem('gv_ma'); } catch (e) {} man('scrLogin'); };

  // ---------- Danh sach de ----------
  [].forEach.call($('locDot').children, function (b) {
    b.onclick = function () { loc = b.getAttribute('data-l'); [].forEach.call($('locDot').children, function (x) { x.classList.toggle('on', x === b); }); veDot(); };
  });
  function conLaiDe(d) {
    if (d.tt !== 'MO' || !d.batdauluc) return null;
    return Math.round((d.batdauluc + d.phut * 60000 - (Date.now() + LECH)) / 1000);
  }
  function mmss(g) { g = Math.max(0, g); return Math.floor(g / 60) + ':' + ('0' + g % 60).slice(-2); }
  function nutCongTac(d, coNutTheo) {
    var chip = d.tt === 'MO' ? '<span class="chip mo">ĐANG LÀM BÀI</span>' : d.tt === 'CHO' ? '<span class="chip cho">PHÒNG CHỜ</span>' : '<span class="chip">Đóng</span>';
    var h = '<div class="dh"><div><h2>' + esc(d.ten) + '</h2><div class="ma">' + esc(d.madot) + ' · ' + d.phut + ' phút · Lớp: ' + esc(d.lop) + '</div></div>' + chip + '</div>';
    var g = conLaiDe(d);
    if (g !== null) h += '<div class="dem" data-madot="' + esc(d.madot) + '">' + (g > 0 ? 'Còn lại <b>' + mmss(g) + '</b>' : '<b>Đã hết giờ</b> – bấm Đóng đề') + '</div>';
    h += '<div class="sw">';
    if (d.tt === 'DONG') {
      h += '<button data-gt="CHO" class="chinh"><b>① Mở phòng chờ</b>HS điền thông tin rồi đợi</button>' +
           '<button data-gt="MO"><b>Bắt đầu ngay</b>Không qua phòng chờ</button>';
    } else if (d.tt === 'CHO') {
      h += '<button data-gt="MO" class="chinh batdau"><b>② ▶ Bắt đầu làm bài</b>Tất cả HS đang chờ vào cùng lúc</button>' +
           '<button data-gt="DONG"><b>Hủy phòng chờ</b>Đóng lại</button>';
    } else {
      h += '<button data-gt="DONG" class="bat"><b>③ ■ Đóng đề</b>Không cho vào thêm</button>';
    }
    h += '<button data-t="xemlai" class="' + (d.xemlai ? 'bat' : '') + '"><b>' + (d.xemlai ? '● Cho xem lại' : '○ Chưa cho xem lại') + '</b>' + (d.xemlai ? 'Bấm để tắt' : 'Bấm khi các lớp đã thi xong') + '</button></div>';
    if (d.tt !== 'DONG' && d.xemlai) h += '<div class="canh">⚠ Đề đang mở và đang cho xem lại cùng lúc: học sinh đã nộp có thể xem đáp án trong khi bạn khác còn làm.</div>';
    if (coNutTheo) h += '<button class="theo">Theo dõi ' + (d.tt === 'CHO' ? 'phòng chờ' : 'nộp bài') + ' ▶</button>';
    return h;
  }
  function ganCongTac(el, d, sau) {
    [].forEach.call(el.querySelectorAll('.sw button'), function (b) {
      b.onclick = function () {
        var du;
        if (b.getAttribute('data-t') === 'xemlai') du = { truong: 'xemlai', giatri: !d.xemlai };
        else {
          var gt = b.getAttribute('data-gt');
          if (gt === 'MO' && !confirm('Bắt đầu làm bài "' + d.ten + '"?\nĐồng hồ ' + d.phut + ' phút bắt đầu chạy cho tất cả học sinh.')) return;
          if (gt === 'DONG' && d.tt === 'MO' && !confirm('Đóng đề? Học sinh chưa vào sẽ không vào được nữa (em đang làm vẫn nộp được).')) return;
          du = { truong: 'trangthai', giatri: gt };
        }
        [].forEach.call(el.querySelectorAll('.sw button'), function (x) { x.disabled = true; });
        b.querySelector('b').textContent = 'Đang lưu...';
        goiBatKy({ action: 'gv_dat', ma: MA, madot: d.madot, truong: du.truong, giatri: du.giatri }).then(function (j) {
          if (!j.ok) { alertLoi(el, j.msg); return; }
          DOT = j.dot; if (j.bayGio) LECH = j.bayGio - Date.now(); sau();
        }).catch(function (e) { alertLoi(el, e.message); });
      };
    });
  }
  function alertLoi(el, m) {
    var x = document.createElement('div'); x.className = 'loi'; x.textContent = 'Chưa lưu được: ' + (m || '') + '. Thử lại.';
    el.appendChild(x); [].forEach.call(el.querySelectorAll('.sw button'), function (b) { b.disabled = false; });
  }
  function veDot() {
    var box = $('dsDot'); box.innerHTML = '';
    var ds = DOT.filter(function (d) { return loc === 'all' || d.tt !== 'DONG'; });
    $('soDot').textContent = DOT.length + ' đề · ' + DOT.filter(function (d) { return d.tt !== 'DONG'; }).length + ' đang mở';
    if (!ds.length) box.innerHTML = '<div class="card sub">Không có đề nào đang mở. Chọn "Tất cả" để mở một đề.</div>';
    ds.forEach(function (d) {
      var el = document.createElement('div'); el.className = 'card dot';
      el.innerHTML = nutCongTac(d, true);
      ganCongTac(el, d, veDot);
      el.querySelector('.theo').onclick = function () { dotXem = d.madot; moTheoDoi(); };
      box.appendChild(el);
    });
  }

  // ---------- Theo doi nop bai ----------
  function dotHienTai() { return DOT.filter(function (d) { return d.madot === dotXem; })[0]; }
  function veDauTheo() {
    var d = dotHienTai(), el = $('theoDot');
    el.innerHTML = nutCongTac(d, false);
    ganCongTac(el, d, function () { veDauTheo(); taiTheoDoi(); });
  }
  function moTheoDoi() { man('scrTheo'); veDauTheo(); $('dsLop').innerHTML = ''; taiTheoDoi(); }
  function taiTheoDoi() {
    clearTimeout(hen);
    var d = dotHienTai(); if (!d) return;
    var lops = lopCuaDot(d), box = $('dsLop');
    if (!lops.length) { box.innerHTML = '<div class="card">Cột Lop của đề này không khớp lớp nào trong danh sách.</div>'; return; }
    $('capNhat').textContent = 'Đang tải...';
    Promise.all(lops.map(function (l) {
      return goi(l.url, { action: 'gv_theodoi', ma: MA, madot: d.madot }).then(function (j) { j.tenLop = l.ten; j.tiento = l.tiento; j.url = l.url; return j; })
        .catch(function (e) { return { ok: false, tenLop: l.ten, msg: 'Không kết nối được (' + e.message + ')' }; });
    })).then(function (kq) {
      box.innerHTML = '';
      kq.forEach(function (j) { box.appendChild(veLop(j)); });
      var n = new Date();
      var chuKy = dotHienTai().tt === 'CHO' ? 8 : 20;
      $('capNhat').textContent = 'Cập nhật lúc ' + gio(n.toISOString()) + ':' + ('0' + n.getSeconds()).slice(-2) + ' · tự làm mới mỗi ' + chuKy + ' giây';
      if (!document.hidden && !$('scrTheo').classList.contains('hidden')) hen = setTimeout(taiTheoDoi, chuKy * 1000);
    });
  }
  var THU_TU = { dangcho: 0, danglam: 1, chua: 2, danop: 3 };
  function veLop(j) {
    var el = document.createElement('div'); el.className = 'card';
    if (!j.ok) { el.innerHTML = '<h2>Lớp ' + esc(j.tenLop) + '</h2><div class="loi">' + (/hop le/i.test(j.msg || '') ? 'Sổ theo dõi lớp này chưa có mã Khối 3: dán SoTheoDoi.gs mới rồi Triển khai → Quản lý → ✎ → Phiên bản mới.' : esc(j.msg || 'Lỗi')) + '</div>'; return el; }
    var dem = { danop: 0, danglam: 0, chua: 0, dangcho: 0 }, tong = 0;
    j.hs.forEach(function (h) { dem[h.tt]++; if (h.tt === 'danop') tong += Number(h.diem) || 0; });
    var tb = dem.danop ? Math.round(tong / dem.danop * 100) / 100 : '–';
    var soXem = j.hs.filter(function (h) { return h.daxem; }).length;
    var now = new Date(j.bayGio).getTime();
    var hs = j.hs.slice().sort(function (a, b) { return THU_TU[a.tt] - THU_TU[b.tt] || (a.mahs < b.mahs ? -1 : 1); });
    var h = '<h2>Lớp ' + esc(j.tenLop) + '</h2><div class="tk">' +
      (dem.dangcho || dotHienTai().tt === 'CHO' ? '<div><b>' + dem.dangcho + '</b><span>Đang chờ</span></div>' : '<div><b>' + dem.danop + '</b><span>Đã nộp</span></div>') +
      '<div><b>' + dem.danglam + '</b><span>Đang làm</span></div>' +
      (dotHienTai().xemlai ? '<div><b>' + soXem + '/' + dem.danop + '</b><span>Đã xem lại</span></div>' : '<div><b>' + dem.chua + '</b><span>Chưa vào</span></div>') +
      '<div><b>' + diem(tb) + '</b><span>Điểm TB</span></div></div>';
    hs.forEach(function (x) {
      var so = String(x.mahs).slice(-2), tt = '';
      if (x.tt === 'danop') tt = '<a href="' + esc(x.pdf) + '" target="_blank" rel="noopener">' + diem(x.diem) + ' đ</a> · nộp ' + gio(x.luc) +
        (dotHienTai().xemlai ? (x.daxem ? '<br><span class="xem">✓ đã xem lại ' + ngayGio(x.xemluc) + '</span>' : '<br><span class="xem chua">chưa xem lại</span>') : '');
      else if (x.tt === 'danglam') tt = 'Đang làm · ' + Math.max(0, Math.round((now - new Date(x.batdau).getTime()) / 60000)) + ' phút';
      else if (x.tt === 'dangcho') tt = 'Đang chờ · vào lúc ' + gio(x.vaocho);
      else tt = (x.vang ? '<span style="color:var(--warn)">Vắng · ' + esc(x.vang) + '</span>' : 'Chưa vào') +
        '<button class="btnVang" data-ma="' + esc(x.mahs) + '" data-xoa="' + (x.vang ? 1 : '') + '">' + (x.vang ? 'Bỏ vắng' : 'Ghi vắng') + '</button>';
      h += '<div class="hs"><span class="so">' + so + '</span><span class="ten">' + esc(x.hoten) + (x.lan > 1 ? '<span class="lan">lần ' + x.lan + '</span>' : '') +
        '</span><span class="tt ' + x.tt + '">' + tt + '</span></div>';
    });
    el.innerHTML = h;
    [].forEach.call(el.querySelectorAll('.btnVang'), function (b) {
      b.onclick = function () {
        b.disabled = true; b.textContent = '...';
        ghiVang(j.url, b.getAttribute('data-ma'), dotXem, 'Vắng', !!b.getAttribute('data-xoa'))
          .then(function (r) { if (!r.ok) throw new Error(r.msg); HS_CACHE = {}; taiTheoDoi(); })
          .catch(function (e) { b.disabled = false; b.textContent = /hop le/i.test(e.message || '') ? 'Cần mã mới' : 'Lỗi'; });
      };
    });
    return el;
  }
  setInterval(function () {
    [].forEach.call(document.querySelectorAll('.dem'), function (el) {
      var d = DOT.filter(function (x) { return x.madot === el.getAttribute('data-madot'); })[0]; if (!d) return;
      var g = conLaiDe(d); if (g === null) return;
      el.innerHTML = g > 0 ? 'Còn lại <b>' + mmss(g) + '</b>' : '<b>Đã hết giờ</b> – bấm Đóng đề';
    });
  }, 1000);
  $('btnLamMoi').onclick = taiTheoDoi;
  $('btnLai').onclick = function () { clearTimeout(hen); man('scrDot'); veDot(); };
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !$('scrTheo').classList.contains('hidden')) taiTheoDoi();
  });

  // ---------- Khoi 5: Ho so hoc sinh ----------
  var HS_LOP = null, HS_DL = null, HS_CACHE = {};
  function ngay(iso) { if (!iso) return ''; var d = new Date(iso); return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2); }
  function phutGiay(g) { g = Number(g) || 0; return Math.floor(g / 60) + ' phút ' + ('0' + g % 60).slice(-2) + ' giây'; }
  function lam2(x) { return Math.round(x * 100) / 100; }
  function vangCua(ma, madot) { return (HS_DL && HS_DL.vang || []).filter(function (v) { return v.mahs === ma && v.madot === madot; })[0]; }
  function ghiVang(url, ma, madot, ghichu, xoa) {
    return goi(url, { action: 'gv_vang', ma: MA, mahs: ma, madot: madot, ghichu: ghichu || '', xoa: !!xoa });
  }
  function sauCung(bai) {
    var m = {};
    bai.forEach(function (b) { var k = b.mahs + '|' + b.madot; if (!m[k] || b.lan > m[k].lan || (b.lan === m[k].lan && b.luc > m[k].luc)) m[k] = b; });
    return m;
  }
  $('btnHoSo').onclick = function () {
    var box = $('locLop'); box.innerHTML = '';
    DS.forEach(function (l) {
      var b = document.createElement('button'); b.textContent = l.ten;
      b.onclick = function () { HS_LOP = l; [].forEach.call(box.children, function (x) { x.classList.toggle('on', x === b); }); taiHoSo(false); };
      box.appendChild(b);
      if (!HS_LOP || HS_LOP.ten === l.ten) { HS_LOP = l; }
    });
    [].forEach.call(box.children, function (x) { x.classList.toggle('on', x.textContent === HS_LOP.ten); });
    man('scrHoSo'); taiHoSo(false);
  };
  $('btnLai2').onclick = function () { man('scrDot'); veDot(); };
  $('btnTaiHS').onclick = function () { taiHoSo(true); };
  $('btnLai3').onclick = function () { veBangDiem(); man('scrHoSo'); };
  function taiHoSo(moi) {
    var l = HS_LOP, box = $('hoSo');
    if (!moi && HS_CACHE[l.ten]) { HS_DL = HS_CACHE[l.ten]; veBangDiem(); return; }
    box.innerHTML = '<div class="card sub">Đang tải hồ sơ lớp ' + esc(l.ten) + '...</div>';
    goi(l.url, { action: 'gv_hoso', ma: MA }).then(function (j) {
      if (HS_LOP !== l) return;
      if (!j.ok) {
        box.innerHTML = '<div class="card"><div class="loi">' + (/hop le/i.test(j.msg || '') ? 'Sổ theo dõi lớp ' + esc(l.ten) + ' chưa có mã Khối 5: dán SoTheoDoi.gs mới rồi Triển khai → Quản lý → ✎ → Phiên bản mới.' : esc(j.msg || 'Lỗi')) + '</div></div>';
        return;
      }
      HS_CACHE[l.ten] = HS_DL = j; veBangDiem();
    }).catch(function (e) { if (HS_LOP === l) box.innerHTML = '<div class="card"><div class="loi">Không kết nối được lớp ' + esc(l.ten) + ' (' + esc(e.message) + ').</div></div>'; });
  }
  function veBangDiem() {
    var j = HS_DL, box = $('hoSo'), m = sauCung(j.bai);
    var card = document.createElement('div'); card.className = 'card';
    if (!j.dot.length) {
      box.innerHTML = '<div class="card"><h2>Lớp ' + esc(j.lop) + '</h2><p class="sub" style="margin-top:8px">Lớp này chưa có bài nộp nào.</p></div>'; return;
    }
    var tongTB = 0, soTB = 0, duoi5 = 0;
    var h = '<table><thead><tr><th class="tn">Học sinh</th>';
    j.dot.forEach(function (d, i) { h += '<th title="' + esc(d.ten) + '">Bài ' + (i + 1) + '</th>'; });
    h += '<th>TB</th></tr></thead><tbody>';
    j.hs.forEach(function (x) {
      var t = 0, n = 0;
      h += '<tr><td class="tn"><button data-ma="' + esc(x.mahs) + '">' + String(x.mahs).slice(-2) + '. ' + esc(x.hoten) + '</button></td>';
      j.dot.forEach(function (d) {
        var b = m[x.mahs + '|' + d.madot];
        if (!b) { var v = vangCua(x.mahs, d.madot); h += v ? '<td class="vg" title="' + esc(v.ghichu || 'Vắng') + '">V</td>' : '<td>–</td>'; return; }
        t += b.diem; n++;
        h += '<td class="' + (b.diem < 5 ? 'thap' : '') + '"><a href="' + esc(b.pdf) + '" target="_blank" rel="noopener">' + diem(b.diem) + '</a>' + (b.lan > 1 ? '<span class="lan2">L' + b.lan + '</span>' : '') + '</td>';
      });
      var tb = n ? lam2(t / n) : null;
      if (tb !== null) { tongTB += tb; soTB++; if (tb < 5) duoi5++; }
      h += '<td class="tb">' + (tb === null ? '–' : diem(tb)) + '</td></tr>';
    });
    h += '<tr class="tblop"><td class="tn">TB lớp</td>';
    j.dot.forEach(function (d) {
      var t = 0, n = 0;
      j.hs.forEach(function (x) { var b = m[x.mahs + '|' + d.madot]; if (b) { t += b.diem; n++; } });
      h += '<td>' + (n ? diem(lam2(t / n)) : '–') + '</td>';
    });
    h += '<td></td></tr></tbody></table>';
    var ct = j.dot.map(function (d, i) { return '<b>Bài ' + (i + 1) + '</b>: ' + esc(d.ten) + ' (' + ngay(d.luc) + ')'; }).join('<br>');
    card.innerHTML = '<h2>Lớp ' + esc(j.lop) + '</h2>' +
      '<div class="tk tk3"><div><b>' + j.hs.length + '</b><span>Học sinh</span></div><div><b>' + j.dot.length + '</b><span>Bài kiểm tra</span></div>' +
      '<div><b>' + (soTB ? diem(lam2(tongTB / soTB)) : '–') + '</b><span>Điểm TB lớp</span></div></div>' +
      (duoi5 ? '<p class="sub">' + duoi5 + ' em có điểm trung bình dưới 5 (điểm dưới 5 được gạch chân).</p>' : '') +
      '<div class="bang">' + h + '</div>' +
      '<div class="chuthich">' + ct + '<br>Điểm tính theo lần làm sau cùng; <span style="color:var(--warn)">L2</span> = làm lại lần 2; <b style="color:var(--warn)">V</b> = vắng thi (bấm tên em để ghi/bỏ vắng).' +
      (function () { var n = (j.vang || []).filter(function (v) { return !m[v.mahs + '|' + v.madot]; }).length; return n ? '<br><b style="color:var(--warn)">' + n + ' lượt vắng chưa thi bù.</b>' : ''; })() + '</div>' +
      '<button class="btn" id="btnGhiBD">Ghi bảng điểm vào Google Sheet (tab BANG DIEM)</button><div id="kqGhi"></div>';
    box.innerHTML = ''; box.appendChild(card);
    [].forEach.call(card.querySelectorAll('.tn button'), function (b) { b.onclick = function () { veMotHS(b.getAttribute('data-ma')); }; });
    $('btnGhiBD').onclick = function () {
      var nut = this, l = HS_LOP; nut.disabled = true; nut.textContent = 'Đang ghi...'; $('kqGhi').innerHTML = '';
      goi(l.url, { action: 'gv_bangdiem', ma: MA }).then(function (r) {
        nut.disabled = false; nut.textContent = 'Ghi bảng điểm vào Google Sheet (tab BANG DIEM)';
        $('kqGhi').innerHTML = r.ok ? '<div class="ghiOK">✓ Đã ghi tab BANG DIEM trong sổ SO THEO DOI ' + esc(r.lop) + ' (' + r.soHS + ' HS, ' + r.soBai + ' bài).</div>' : '<div class="loi">' + esc(r.msg || 'Lỗi') + '</div>';
      }).catch(function (e) { nut.disabled = false; nut.textContent = 'Ghi bảng điểm vào Google Sheet (tab BANG DIEM)'; $('kqGhi').innerHTML = '<div class="loi">' + esc(e.message) + '</div>'; });
    };
  }
  function bieuDo(ds) {
    // ds: [{nhan, diem}] theo thoi gian; truc 0-10, vach 5 net dut
    var W = 600, H = 230, L = 34, R = 14, T = 14, B = 34, n = ds.length;
    var P = 30, x = function (i) { return n === 1 ? (L + W - R) / 2 : L + P + i * (W - L - R - 2 * P) / (n - 1); };
    var y = function (v) { return T + (10 - v) * (H - T - B) / 10; };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Biểu đồ điểm">';
    [0, 5, 10].forEach(function (v) {
      s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#c9cdd8" stroke-width="1"' + (v === 5 ? ' stroke-dasharray="6 5"' : '') + '/>' +
        '<text x="' + (L - 8) + '" y="' + (y(v) + 5) + '" font-size="14" text-anchor="end" fill="#5b6175">' + v + '</text>';
    });
    if (n > 1) s += '<polyline fill="none" stroke="#1f5fbf" stroke-width="3" points="' + ds.map(function (d, i) { return x(i) + ',' + y(d.diem); }).join(' ') + '"/>';
    ds.forEach(function (d, i) {
      s += '<circle cx="' + x(i) + '" cy="' + y(d.diem) + '" r="6" fill="' + (d.diem < 5 ? '#fff' : '#1f5fbf') + '" stroke="#1f5fbf" stroke-width="3"/>' +
        '<text x="' + x(i) + '" y="' + (y(d.diem) - 12) + '" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a2e">' + diem(d.diem) + '</text>' +
        '<text x="' + x(i) + '" y="' + (H - 10) + '" font-size="13" text-anchor="middle" fill="#5b6175">' + esc(d.nhan) + '</text>';
    });
    return s + '</svg>';
  }
  function veMotHS(ma) {
    var j = HS_DL, x = j.hs.filter(function (h) { return h.mahs === ma; })[0];
    var soBai = {}; j.dot.forEach(function (d, i) { soBai[d.madot] = i + 1; });
    var ten = {}; j.dot.forEach(function (d) { ten[d.madot] = d.ten; });
    var cua = j.bai.filter(function (b) { return b.mahs === ma; }).sort(function (a, b) { return a.luc < b.luc ? -1 : 1; });
    var m = sauCung(cua), tinh = Object.keys(m).map(function (k) { return m[k]; }).sort(function (a, b) { return soBai[a.madot] - soBai[b.madot]; });
    var tong = tinh.reduce(function (t, b) { return t + b.diem; }, 0);
    var cao = tinh.length ? Math.max.apply(null, tinh.map(function (b) { return b.diem; })) : null;
    var thap = tinh.length ? Math.min.apply(null, tinh.map(function (b) { return b.diem; })) : null;
    var chuaLam = j.dot.filter(function (d) { return !m[ma + '|' + d.madot]; }).map(function (d) { return 'Bài ' + soBai[d.madot]; });
    var h = '<div class="card"><h1>' + esc(x.hoten) + '</h1><p class="sub">SBD ' + esc(ma) + ' · Lớp ' + esc(j.lop) + '</p>' +
      '<div class="tk"><div><b>' + tinh.length + '/' + j.dot.length + '</b><span>Bài đã làm</span></div>' +
      '<div><b>' + (tinh.length ? diem(lam2(tong / tinh.length)) : '–') + '</b><span>Điểm TB</span></div>' +
      '<div><b>' + (cao === null ? '–' : diem(cao)) + '</b><span>Cao nhất</span></div>' +
      '<div><b>' + (thap === null ? '–' : diem(thap)) + '</b><span>Thấp nhất</span></div></div>' +
      '</div>';
    var chuaDot = j.dot.filter(function (d) { return !m[ma + '|' + d.madot]; });
    if (chuaDot.length) {
      h += '<div class="card"><h2>Bài chưa làm · ghi vắng thi</h2><p class="sub">Ghi lại để nhớ cho em thi bù. Thông tin lưu ở tab VANG THI trong sổ.</p>';
      chuaDot.forEach(function (d) {
        var v = vangCua(ma, d.madot);
        h += '<div class="vgRow" data-madot="' + esc(d.madot) + '"><div class="vt">Bài ' + soBai[d.madot] + ' · ' + esc(d.ten) + '</div>' +
          (v ? '<div class="vs">✎ Vắng: ' + esc(v.ghichu || '(không ghi chú)') + (v.luc ? ' · ghi ' + ngay(v.luc) : '') + '</div><div class="vgBtns"><button data-act="xoa">Bỏ ghi vắng</button></div>'
             : '<div class="vgBtns"><button data-act="cp">Vắng có phép</button><button data-act="kp">Vắng không phép</button><input placeholder="Ghi chú thêm (vd: thi bù 25/10)"></div>') +
          '</div>';
      });
      h += '<div class="loi" id="vgLoi"></div></div>';
    }
    if (tinh.length) h += '<div class="card bieudo"><h2>Tiến bộ qua các bài</h2><p class="sub">Đường nét đứt là mốc 5 điểm; chấm rỗng là điểm dưới 5.</p>' +
      bieuDo(tinh.map(function (b) { return { nhan: 'Bài ' + soBai[b.madot], diem: b.diem }; })) + '</div>';
    h += '<div class="card"><h2>Các lần làm bài</h2>';
    if (!cua.length) h += '<p class="sub" style="margin-top:8px">Em này chưa nộp bài nào.</p>';
    cua.slice().reverse().forEach(function (b) {
      h += '<div class="bai"><div class="d' + (b.diem < 5 ? ' thap' : '') + '">' + diem(b.diem) + '</div><div class="tb2"><b>Bài ' + soBai[b.madot] + ' · ' + esc(ten[b.madot]) + '</b>' +
        (b.lan > 1 ? '<span class="lan">lần ' + b.lan + '</span>' : '') + (vangCua(ma, b.madot) ? '<span class="tag">thi bù</span>' : '') +
        '<div>' + ngay(b.luc) + ' lúc ' + gio(b.luc) + ' · đúng ' + b.dung + '/' + b.tong + ' câu · làm ' + phutGiay(b.giay) + '</div></div>' +
        (b.pdf ? '<a class="pdf" href="' + esc(b.pdf) + '" target="_blank" rel="noopener">PDF</a>' : '') + '</div>';
    });
    $('motHS').innerHTML = h + '</div>';
    [].forEach.call(document.querySelectorAll('#motHS .vgRow button'), function (b) {
      b.onclick = function () {
        var row = b.closest('.vgRow'), madot = row.getAttribute('data-madot'), act = b.getAttribute('data-act');
        var inp = row.querySelector('input'), them = inp && inp.value.trim();
        var ghichu = act === 'cp' ? 'Có phép' : act === 'kp' ? 'Không phép' : '';
        if (them) ghichu += (ghichu ? ' – ' : '') + them;
        [].forEach.call(row.querySelectorAll('button'), function (x) { x.disabled = true; });
        b.textContent = 'Đang lưu...';
        ghiVang(HS_LOP.url, ma, madot, ghichu, act === 'xoa').then(function (r) {
          if (!r.ok) throw new Error(r.msg || 'lỗi');
          HS_DL.vang = r.vang; veMotHS(ma); window.scrollTo(0, 0);
        }).catch(function (e) {
          $('vgLoi').textContent = /hop le/i.test(e.message) ? 'Sổ lớp này chưa có mã mới (ghi vắng): dán SoTheoDoi.gs mới rồi Triển khai phiên bản mới.' : 'Chưa lưu được: ' + e.message;
          veMotHS(ma);
        });
      };
    });
    man('scrMotHS');
  }

  if (MA) vao(MA); else man('scrLogin');
})();
</script>
