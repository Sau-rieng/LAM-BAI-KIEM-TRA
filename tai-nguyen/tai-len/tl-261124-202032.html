const tabsEl = document.getElementById('shellTabs'), framesEl = document.getElementById('shellFrames');
function b64ToBlobUrl(b64) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes], { type: 'text/html;charset=utf-8' }));
}
function showSection(i) {
  SECTIONS.forEach((s, k) => {
    s.btn.classList.toggle('active', k === i);
    if (s.frame) s.frame.classList.toggle('show', k === i);
  });
  const s = SECTIONS[i];
  if (!s.frame) {
    const f = document.createElement('iframe');
    f.title = s.label; f.setAttribute('allowfullscreen', ''); f.allow = 'fullscreen';
    f.src = b64ToBlobUrl(s.data);
    framesEl.appendChild(f); s.frame = f; s.data = null;
  }
  s.frame.classList.add('show');
  const ld = document.getElementById('shellLoad'); if (ld) ld.remove();
  try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
}
SECTIONS.forEach((s, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'shell-tab'; b.textContent = s.label;
  b.onclick = () => showSection(i); tabsEl.appendChild(b); s.btn = b;
});
function shellFullscreen() {
  const el = document.documentElement;
  if (el.requestFullscreen) { document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen().catch(()=>{}); }
  else if (el.webkitRequestFullscreen) { document.webkitFullscreenElement ? document.webkitExitFullscreen() : el.webkitRequestFullscreen(); }
  else { document.getElementById('shellFs').style.display = 'none'; }
}
if (!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen) document.getElementById('shellFs').style.display = 'none';
const start = Math.min(SECTIONS.length, Math.max(1, parseInt((location.hash || '#1').slice(1), 10) || 1)) - 1;
showSection(start);
