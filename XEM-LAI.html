<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xem lại bài làm</title>
<style>
:root{--ink:#1a1a2e;--muted:#5b6175;--line:#d9dce5;--bg:#f4f5f9;--card:#fff;--pri:#1f5fbf;--ok:#1e8e3e;--bad:#c5221f;--okbg:#e8f5ec;--badbg:#fdecea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px}
main{max-width:760px;margin:0 auto;padding:24px 16px}
.card{background:var(--card);border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);padding:22px;margin-bottom:14px}
h1{font-size:26px;margin:0 0 4px}
h2{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 12px}
label{display:block;font-weight:600;margin:16px 0 6px}
select,input{width:100%;font-size:20px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.sbd{display:flex;align-items:center;gap:8px}
.sbd .pre{font-size:22px;font-weight:700;padding:12px 14px;background:var(--bg);border-radius:12px;letter-spacing:1px}
.sbd input{width:110px;text-align:center;letter-spacing:3px}
button{font-size:18px;font-weight:600;border:0;border-radius:12px;padding:13px 18px;cursor:pointer;font-family:inherit}
.btn{background:var(--pri);color:#fff;width:100%;margin-top:20px}
.btn2{background:#fff;border:2px solid var(--line);color:var(--ink)}
.msg{margin-top:12px;min-height:22px;font-weight:600}
.err{color:var(--bad)}
.hidden{display:none}
.dot{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);margin-top:10px;color:var(--ink)}
.dot b{display:block;font-size:20px}
.dot span{color:var(--muted);font-weight:500}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 4px}
.bar label{display:flex;align-items:center;gap:8px;margin:0;font-weight:600}
.bar input{width:22px;height:22px}
.diem{font-size:40px;font-weight:800;margin:4px 0}
.q{border-left:6px solid var(--line)}
.q.dung{border-left-color:var(--ok)}
.q.sai{border-left-color:var(--bad)}
.qh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:6px}
.tag{font-weight:800;white-space:nowrap}
.tag.dung{color:var(--ok)}.tag.sai{color:var(--bad)}.tag.bo{color:var(--muted)}
.nd{line-height:1.5;margin-bottom:10px}
.q img{max-width:100%;max-height:300px;display:block;margin:6px auto 10px}
.pa{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:10px;margin-bottom:8px;line-height:1.4}
.pa .l{flex:none;font-weight:800;width:24px}
.pa .t{flex:1}
.pa .n{font-weight:700;white-space:nowrap;font-size:15px}
.pa.da{border-color:var(--ok);background:var(--okbg)}
.pa.chonsai{border-color:var(--bad);background:var(--badbg)}
.nd img,.pa img{max-width:100%;height:auto;vertical-align:middle}
.nd img{display:block;margin:6px auto 10px;max-height:300px}
.ph{font-size:20px;font-weight:800;margin:20px 4px 8px;color:var(--muted)}
.tag.mot{color:#a06b00}
.goiy{border:2px solid var(--pri);background:#eef4fd;border-radius:12px;padding:14px 16px;margin:6px 0 12px}
.goiy .gh{font-weight:800;color:var(--pri);margin-bottom:6px}
.goiy p{margin:0 0 6px;line-height:1.5}
.goiy ul{margin:0 0 6px;padding-left:22px;line-height:1.5}
.goiy .gc{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<main>

<section id="scrLogin" class="card">
  <h1>Xem lại bài làm</h1>
  <p class="sub">Nhập SBD và mã xem bài giáo viên đã phát cho em.</p>
  <label for="lop">Lớp</label>
  <select id="lop"><option value="">– Chọn lớp –</option></select>
  <label for="sbd">Số báo danh (nhập 2 số cuối)</label>
  <div class="sbd"><span class="pre" id="pre">------</span><input id="sbd" inputmode="numeric" maxlength="2" autocomplete="off"></div>
  <label for="maxem">Mã xem bài</label>
  <input id="maxem" type="password" inputmode="numeric" autocomplete="off">
  <button class="btn" id="btnXem">Xem bài</button>
  <div class="msg" id="msg"></div>
</section>

<section id="scrDS" class="hidden">
  <div class="card">
    <h1 id="tenhs"></h1>
    <p class="sub">Chọn bài kiểm tra để xem lại.</p>
    <div id="dsBai"></div>
    <button class="btn btn2" id="btnRa1">Thoát</button>
  </div>
</section>

<section id="scrBai" class="hidden">
  <div class="card">
    <button class="btn2" id="btnLai">◀ Danh sách bài</button>
    <h2 style="margin-top:14px" id="tenBai"></h2>
    <div class="diem" id="diemBai"></div>
    <p class="sub" id="tomTat"></p>
    <div class="goiy hidden" id="goiY">
      <div class="gh">🤖 Gợi ý ôn tập dành cho em</div>
      <p id="goiYNX"></p>
      <ul id="goiYDS"></ul>
      <div class="gc">Gợi ý do AI soạn, giáo viên đã xem trước khi gửi em.</div>
    </div>
    <div class="bar"><label><input type="checkbox" id="chiSai"> Chỉ xem câu sai và câu bỏ trống</label></div>
  </div>
  <div id="dsCau"></div>
</section>

</main>
<script src="cau-hinh-lop.js"></script>
<script>
(function () {
  var DS = window.DS_LOP || [];
  var lopChon = null, duLieu = null, baiDangXem = null;
  function $(id) { return document.getElementById(id); }
  function loi(t) { $('msg').className = 'msg err'; $('msg').textContent = t; }
  function man(id) { ['scrLogin', 'scrDS', 'scrBai'].forEach(function (k) { $(k).classList.toggle('hidden', k !== id); }); window.scrollTo(0, 0); }

  DS.forEach(function (l, i) { var o = document.createElement('option'); o.value = i; o.textContent = l.ten; $('lop').appendChild(o); });
  $('lop').onchange = function () { lopChon = DS[this.value] || null; $('pre').textContent = lopChon ? lopChon.tiento : '------'; };

  $('btnXem').onclick = function () {
    $('msg').className = 'msg'; $('msg').textContent = '';
    if (!lopChon) return loi('Em chưa chọn lớp.');
    var s2 = $('sbd').value.trim();
    if (!/^\d{2}$/.test(s2)) return loi('Hãy nhập đúng 2 số cuối của SBD.');
    var mx = $('maxem').value.trim();
    if (!mx) return loi('Em chưa nhập mã xem bài.');
    $('msg').textContent = 'Đang tải bài...';
    $('btnXem').disabled = true;
    fetch(lopChon.url, { method: 'POST', body: JSON.stringify({ action: 'xemlai', mahs: lopChon.tiento + s2, maxem: mx }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        $('btnXem').disabled = false;
        if (!j.ok) return loi('SBD hoặc mã xem bài chưa đúng.');
        duLieu = j; $('maxem').value = ''; $('msg').textContent = '';
        veDanhSach();
      })
      .catch(function () { $('btnXem').disabled = false; loi('Không kết nối được. Kiểm tra mạng rồi bấm lại.'); });
  };

  function veDanhSach() {
    $('tenhs').textContent = duLieu.hoten;
    var box = $('dsBai'); box.innerHTML = '';
    if (!duLieu.bai.length) box.innerHTML = '<p class="sub">Chưa có bài nào được giáo viên mở cho xem lại.</p>';
    duLieu.bai.forEach(function (b, i) {
      var nut = document.createElement('button'); nut.className = 'dot';
      nut.innerHTML = '<b></b><span></span>';
      nut.querySelector('b').textContent = b.ten;
      nut.querySelector('span').textContent = b.diem + ' điểm · đúng ' + b.socaudung + '/' + b.tongsocau + ' câu';
      nut.onclick = function () { baiDangXem = b; veBai(); };
      box.appendChild(nut);
    });
    man('scrDS');
  }

  function veBai() {
    var b = baiDangXem;
    $('tenBai').textContent = b.ten;
    $('diemBai').textContent = b.diem + ' điểm';
    var sai = b.cau.filter(function (q) { return !q.dung; }).map(function (q) { var n = nhan(q); return (n.phan ? n.phan + '.' : '') + n.so; });
    $('tomTat').textContent = 'Đúng hoàn toàn ' + b.socaudung + '/' + b.tongsocau + ' câu. ' + (sai.length ? 'Câu cần làm lại: ' + sai.join(', ') + '.' : 'Em làm đúng tất cả!');
    var g = b.goiy;
    $('goiY').classList.toggle('hidden', !(g && g.nhanxet));
    if (g && g.nhanxet) {
      $('goiYNX').textContent = g.nhanxet;
      var ul = $('goiYDS'); ul.innerHTML = '';
      (g.canon || []).forEach(function (t) { var li = document.createElement('li'); li.textContent = 'Ôn lại: ' + t; ul.appendChild(li); });
    }
    veCau();
    man('scrBai');
  }

  var TEN_PHAN = { I: 'Phần I · Trắc nghiệm', II: 'Phần II · Đúng/Sai', III: 'Phần III · Trả lời ngắn' };
  function nhan(q) { var m = String(q.cau).match(/^(I{1,3})\.(\d+)$/); return m ? { phan: m[1], so: m[2] } : { phan: '', so: q.cau }; }
  function veCau() {
    var box = $('dsCau'); box.innerHTML = '';
    var chiSai = $('chiSai').checked, phanTruoc = null;
    baiDangXem.cau.forEach(function (q) {
      if (chiSai && q.dung) return;
      var n = nhan(q);
      if (n.phan && n.phan !== phanTruoc) { var t = document.createElement('div'); t.className = 'ph'; t.textContent = TEN_PHAN[n.phan]; box.appendChild(t); }
      phanTruoc = n.phan;
      var trangThai = q.chon === '' ? 'bo' : (q.dung ? 'dung' : 'sai');
      var chu = trangThai === 'dung' ? '✓ Đúng' : trangThai === 'sai' ? '✗ Sai' : '– Bỏ trống';
      if (q.loai === 'DS' && trangThai !== 'bo') { chu = (q.dung ? '✓ ' : '') + 'Đúng ' + q.soY + '/4 ý'; if (!q.dung && q.soY > 0) trangThai = 'mot'; }
      var the = document.createElement('div'); the.className = 'card q ' + (q.dung ? 'dung' : 'sai');
      var h = '<div class="qh"><b>Câu ' + n.so + '</b><span class="tag ' + trangThai + '">' + chu + '</span></div>' +
        '<div class="nd">' + q.hoi + '</div>' + (q.hinh ? '<img src="' + q.hinh + '" alt="Hình câu hỏi">' : '');
      if (q.loai === 'DS') {
        ['A', 'B', 'C', 'D'].forEach(function (k, y) {
          var da = q.dapan[y], x = (q.chon || '')[y];
          var chon = x === 'D' || x === 'S';
          var lop = chon ? (x === da ? ' da' : ' chonsai') : '';
          var nhanY = 'Đáp án: ' + (da === 'D' ? 'Đúng' : 'Sai') + (chon ? (x === da ? ' · ✓ Em chọn đúng' : ' · ✗ Em chọn ' + (x === 'D' ? 'Đúng' : 'Sai')) : ' · Em bỏ trống');
          h += '<div class="pa' + lop + '"><span class="l">' + 'abcd'[y] + ')</span><span class="t">' + q.pa[k] + '<br><b style="font-size:15px">' + nhanY + '</b></span></div>';
        });
        the.innerHTML = h; box.appendChild(the); return;
      }
      if (q.loai === 'TLN') {
        h += '<div class="pa da"><span class="t">Đáp án: <b>' + String(q.dapan).replace(/</g, '&lt;') + '</b></span></div>';
        h += '<div class="pa' + (q.chon ? (q.dung ? ' da' : ' chonsai') : '') + '"><span class="t">Em trả lời: <b>' +
          (q.chon ? String(q.chon).replace(/</g, '&lt;') + (q.dung ? ' ✓' : ' ✗') : 'bỏ trống') + '</b></span></div>';
        the.innerHTML = h; box.appendChild(the); return;
      }
      ['A', 'B', 'C', 'D'].forEach(function (k) {
        if (String(q.pa[k]).trim() === '') return;
        var laDa = k === q.dapan, laChon = k === q.chon;
        var lop = laDa ? ' da' : (laChon ? ' chonsai' : '');
        var nhan = (laDa ? '✓ Đáp án' : '') + (laChon ? (laDa ? ' · Em chọn' : '✗ Em chọn') : '');
        h += '<div class="pa' + lop + '"><span class="l">' + k + '.</span><span class="t">' + q.pa[k] + '</span><span class="n">' + nhan + '</span></div>';
      });
      the.innerHTML = h;
      box.appendChild(the);
    });
    if (!box.children.length) box.innerHTML = '<div class="card">Không có câu sai nào.</div>';
  }
  $('chiSai').onchange = veCau;
  $('btnLai').onclick = function () { man('scrDS'); };
  $('btnRa1').onclick = function () { duLieu = null; man('scrLogin'); };
})();
</script>
</body>
</html>
